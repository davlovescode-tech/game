<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Bhaag Brainrot</title>
<meta name="description" content="Outrun the floating faces. A Daviccino production. @lowkeytuffdav">
<meta name="theme-color" content="#120a2e">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Poppins:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--ac:#ffb703;--pink:#ff3df0;--cy:#27e6ff;--bad:#ff4d6d;--ok:#3ddc84;--bg:#120a2e;--f1:"Bungee",Impact,"Arial Black",sans-serif;--f2:"Poppins",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);font-family:var(--f2);color:#fff;user-select:none;-webkit-user-select:none}
#cv{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block;outline:none}
button{font:inherit}
a{color:inherit}

/* ---------- title ---------- */
#title{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;justify-content:center;padding:max(18px,env(safe-area-inset-top)) 6vw 74px;pointer-events:none;overflow:hidden}
#title>*{pointer-events:auto}
#title .vig{position:absolute;inset:0;pointer-events:none;background:
  radial-gradient(900px 600px at 18% 45%,rgba(18,10,46,.78),transparent 70%),
  linear-gradient(180deg,rgba(18,10,46,.55),transparent 28%,transparent 62%,rgba(18,10,46,.92))}
#floaties{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#floaties span{position:absolute;bottom:-60px;font-size:28px;opacity:.0;animation:rise linear infinite;filter:drop-shadow(0 0 8px #ff3df0aa)}
@keyframes rise{0%{transform:translateY(0) rotate(0);opacity:0}10%{opacity:.9}90%{opacity:.9}100%{transform:translateY(-115vh) rotate(360deg);opacity:0}}
.insta{position:absolute;top:max(14px,env(safe-area-inset-top));right:14px;display:flex;align-items:center;gap:8px;padding:9px 16px 9px 12px;border-radius:999px;text-decoration:none;font-weight:800;font-size:14px;color:#fff;
  background:linear-gradient(45deg,#f09433,#e6683c 25%,#dc2743 50%,#cc2366 75%,#bc1888);box-shadow:0 6px 24px #dc274355,0 0 0 2px #ffffff30 inset;transition:transform .15s}
.insta:hover{transform:scale(1.06) rotate(-1.5deg)}
.insta svg{width:20px;height:20px}
.hero{position:relative;max-width:620px}
.kicker{display:inline-block;font-weight:800;font-size:12px;letter-spacing:.28em;color:#ffe066;padding:6px 12px;border:1px solid #ffe06666;border-radius:999px;background:#0006;margin-bottom:10px;animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-4px)}}
.glitch{position:relative;margin:0;font-family:var(--f1);font-weight:400;line-height:.92;font-size:clamp(46px,11.5vw,128px);letter-spacing:.01em;text-transform:uppercase}
.glitch.g2{font-size:clamp(40px,9.6vw,108px)}
.glitch span{position:relative;display:inline-block;background:linear-gradient(180deg,#fff 0%,#ffe066 38%,#ff8a1f 62%,#ff3df0 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 4px 0 #3b0a5a) drop-shadow(0 0 22px #ff3df088)}
.glitch.g2 span{background:linear-gradient(180deg,#fff 0%,#9ff3ff 40%,#27e6ff 62%,#8338ec 100%);-webkit-background-clip:text;background-clip:text;filter:drop-shadow(0 4px 0 #0a1a5a) drop-shadow(0 0 22px #27e6ff88)}
.glitch:before,.glitch:after{content:attr(data-text);position:absolute;left:0;top:0;width:100%;overflow:hidden;clip-path:inset(0 0 0 0);opacity:.0}
.glitch:before{color:#ff3df0;animation:gl1 3.2s infinite steps(1)}
.glitch:after{color:#27e6ff;animation:gl2 3.2s infinite steps(1)}
@keyframes gl1{0%,88%,100%{opacity:0}90%{opacity:.9;transform:translate(-5px,1px);clip-path:inset(10% 0 55% 0)}94%{opacity:.9;transform:translate(4px,-2px);clip-path:inset(60% 0 8% 0)}}
@keyframes gl2{0%,89%,100%{opacity:0}91%{opacity:.9;transform:translate(5px,-1px);clip-path:inset(50% 0 20% 0)}95%{opacity:.9;transform:translate(-4px,2px);clip-path:inset(5% 0 70% 0)}}
.tag{margin:14px 0 14px;font-weight:700;font-size:clamp(14px,2.4vw,19px);color:#ffeefe;text-shadow:0 2px 10px #000}
.tag b{color:var(--cy)}
.card{display:flex;gap:10px;flex-wrap:wrap;align-items:stretch;padding:12px;border-radius:20px;background:#ffffff14;border:1px solid #ffffff33;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 10px 40px #0008;max-width:520px}
.card input{flex:1 1 150px;min-width:0;padding:14px 16px;border-radius:14px;border:2px solid #ffffff33;background:#0b0620cc;color:#fff;font:700 16px var(--f2);outline:none}
.card input:focus{border-color:var(--cy);box-shadow:0 0 0 4px #27e6ff33}
#play{flex:1 1 170px;position:relative;border:0;cursor:pointer;padding:14px 22px;border-radius:14px;font:400 22px var(--f1);letter-spacing:.04em;color:#2b0a00;background:linear-gradient(180deg,#ffe066,#ff8a1f);box-shadow:0 5px 0 #a14d00,0 0 30px #ff8a1f88;animation:pulse 1.6s ease-in-out infinite}
#play:active{transform:translateY(3px);box-shadow:0 2px 0 #a14d00}
#play[disabled]{animation:none;filter:grayscale(.6);opacity:.7;cursor:wait}
@keyframes pulse{50%{box-shadow:0 5px 0 #a14d00,0 0 52px #ffb703cc;transform:scale(1.025)}}
.says{margin-top:14px;max-width:520px;min-height:48px;display:flex;align-items:center;gap:10px;padding:8px 14px 8px 8px;border-radius:16px;background:#000a;border:1px solid #ffffff22;font-weight:700;font-size:14px;animation:float 4s ease-in-out infinite}
.says .pic{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font:400 18px var(--f1);color:#2b0a00;background:linear-gradient(135deg,#ffe066,#ff3df0);box-shadow:0 0 14px #ff3df0}
.says small{display:block;font-size:10px;letter-spacing:.2em;color:#ffe066}
.keys{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;font-size:11.5px;color:#d8c9f5}
.keys i{font-style:normal;background:#ffffff18;border:1px solid #ffffff26;padding:4px 9px;border-radius:8px}
.marquee{position:absolute;left:0;right:0;bottom:0;height:46px;overflow:hidden;background:linear-gradient(90deg,#ff3df0,#8338ec,#27e6ff);transform:rotate(0);display:flex;align-items:center;box-shadow:0 -6px 30px #000a}
.mq{display:flex;white-space:nowrap;font:400 17px var(--f1);letter-spacing:.06em;color:#fff;text-shadow:0 2px 0 #0007;animation:mq 26s linear infinite}
.mq span{padding-right:40px}
@keyframes mq{to{transform:translateX(-50%)}}

/* ---------- hud ---------- */
.pill{background:#0009;border:1px solid #fff3;border-radius:14px;padding:6px 16px;font-weight:800;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#timer{position:fixed;top:max(10px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);font-size:18px;white-space:nowrap;z-index:10}
#sub{position:fixed;top:calc(max(10px,env(safe-area-inset-top)) + 42px);left:50%;transform:translateX(-50%);font-size:12px;color:#fff;white-space:nowrap;text-shadow:0 1px 3px #000;z-index:10;font-weight:700}
#chips{position:fixed;top:calc(max(10px,env(safe-area-inset-top)) + 64px);left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:10;flex-wrap:wrap;justify-content:center;max-width:92vw}
#chips b{font-size:12px;background:#000b;border:1px solid #ffffff33;border-radius:999px;padding:3px 10px}
#feed{position:fixed;top:max(10px,env(safe-area-inset-top));left:10px;display:flex;flex-direction:column;gap:4px;max-width:44vw;pointer-events:none;z-index:10}
#feed .f{background:#000b;border-left:3px solid var(--bad);padding:4px 8px;border-radius:6px;font-size:12px;font-weight:600;animation:in .2s}
@keyframes in{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
#topr{position:fixed;top:max(10px,env(safe-area-inset-top));right:10px;display:flex;flex-direction:column;align-items:flex-end;gap:6px;z-index:10}
#topr .insta{position:static;padding:6px 12px 6px 9px;font-size:12px}
#topr .insta svg{width:16px;height:16px}
#stats{text-align:right;font-size:13px;line-height:1.5;display:none}
.mini{background:#0009;border:1px solid #fff3;color:#fff;border-radius:10px;padding:6px 10px;font-weight:800;font-size:12px;cursor:pointer}
#lb{position:fixed;left:10px;top:92px;width:min(300px,62vw);background:#0b0620dd;border:2px solid var(--ac);border-radius:16px;padding:10px;display:none;max-height:calc(100vh - 220px);overflow:auto;z-index:9;backdrop-filter:blur(6px)}
#lb h3{margin:0 0 6px;text-align:center;color:var(--ac);letter-spacing:.12em;font:400 15px var(--f1)}
#lb table{width:100%;border-collapse:collapse;font-size:12px}
#lb th{color:#aaa;font-weight:600;text-align:right;padding:2px 5px}
#lb th:nth-child(2),#lb td:nth-child(2){text-align:left}
#lb td{padding:3px 5px;text-align:right;border-top:1px solid #fff2}
#lb tr.you td{background:#ffb70333;font-weight:800}
#lb .win{text-align:center;font-weight:800;font-size:14px;color:var(--ok);margin-bottom:6px}
#death{position:fixed;left:0;right:0;top:28%;text-align:center;font:400 clamp(26px,6vw,58px) var(--f1);color:#fff;text-shadow:0 4px 0 #b00020,0 0 24px #000;display:none;padding:0 16px;pointer-events:none;z-index:20}
#death small{display:block;font:800 .32em var(--f2);margin-top:8px;color:var(--ac)}
#banner{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);font:400 clamp(28px,6vw,60px) var(--f1);text-align:center;display:none;text-shadow:0 4px 0 #000,0 0 30px #ff3df0;pointer-events:none;z-index:20;width:94vw}
#prompt{position:fixed;left:50%;bottom:max(22px,env(safe-area-inset-bottom));transform:translateX(-50%);display:none;z-index:12;border:0;cursor:pointer;padding:13px 22px;border-radius:16px;font:800 16px var(--f2);color:#2b0a00;background:linear-gradient(180deg,#ffe066,#ff8a1f);box-shadow:0 5px 0 #a14d00,0 0 30px #ff8a1f77;white-space:nowrap}
#prompt:active{transform:translateX(-50%) translateY(3px)}
#hint{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);font-size:11.5px;color:#fff;background:#000a;padding:4px 12px;border-radius:999px;z-index:8;pointer-events:none;transition:opacity 1s;white-space:nowrap;max-width:96vw;overflow:hidden;text-overflow:ellipsis}
#davi{position:fixed;right:10px;top:42%;display:flex;flex-direction:column;gap:8px;z-index:30;pointer-events:none;width:min(300px,78vw)}
#davi .dv{display:flex;gap:10px;align-items:center;padding:8px 12px 8px 8px;border-radius:16px;background:linear-gradient(135deg,#2a0a52f0,#6a1b9af0);border:2px solid #ffe066;box-shadow:0 0 30px #ff3df099;animation:dvin .35s cubic-bezier(.2,1.4,.4,1)}
#davi .dv.out{animation:dvout .4s forwards}
#davi .pic{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font:400 24px var(--f1);color:#2b0a00;background:linear-gradient(135deg,#ffe066,#ff3df0) center/cover;box-shadow:0 0 16px #ff3df0;border:2px solid #fff}
#davi b{display:block;font:400 11px var(--f1);letter-spacing:.14em;color:#ffe066}
#davi span{font-weight:700;font-size:13px;line-height:1.25}
#davi em{display:block;font-style:normal;font-size:10px;color:#ff9ff3;margin-top:2px}
@keyframes dvin{from{opacity:0;transform:translateX(60px) scale(.8)}to{opacity:1;transform:none}}
@keyframes dvout{to{opacity:0;transform:translateX(60px)}}
#joy{position:fixed;left:18px;bottom:max(22px,env(safe-area-inset-bottom));width:130px;height:130px;border-radius:50%;background:#ffffff1f;border:2px solid #fff5;touch-action:none;display:none;z-index:11}
#joy i{position:absolute;left:50%;top:50%;width:52px;height:52px;border-radius:50%;background:#fffb;transform:translate(-50%,-50%)}
#jump{position:fixed;right:18px;bottom:calc(max(22px,env(safe-area-inset-bottom)) + 24px);width:84px;height:84px;border-radius:50%;border:0;background:#ffb703dd;color:#2b1100;font-weight:900;display:none;touch-action:none;z-index:11}
.hush .says{border-color:#ffd9a0;box-shadow:0 0 28px #ffd9a066;transition:all .6s}.hush #nameIn{border-color:#ffd9a0;box-shadow:0 0 18px #ffd9a055}.hush .vig{background:radial-gradient(ellipse at 50% 60%,#ffd9a022,transparent 60%),var(--v,transparent)}
.mp{margin-top:10px;padding:8px 12px}
.mp button{flex:1 1 120px;border:0;cursor:pointer;padding:11px 14px;border-radius:12px;font:800 14px var(--f2);letter-spacing:.04em;color:#06222a;background:linear-gradient(180deg,#7ff3ff,#27e6ff)}
.mp button[disabled]{filter:grayscale(.6);opacity:.6;cursor:wait}
.mp #joinRoom{flex:0 1 90px;background:linear-gradient(180deg,#ffe066,#ffb703);color:#2b0a00}
.mp input{flex:1 1 110px;text-transform:uppercase;letter-spacing:.3em;text-align:center;font-size:15px;padding:11px 10px}
#mpMsg{margin-top:8px;min-height:18px;max-width:520px;font-weight:700;font-size:13px;color:#ffe066;text-shadow:0 1px 4px #000}
#roomChip{font-weight:800;letter-spacing:.12em}
</style>
</head>
<body>
<canvas id="cv" tabindex="0"></canvas>

<div id="hud" style="display:none">
  <div id="timer" class="pill"></div>
  <div id="sub"></div>
  <div id="chips"></div>
  <div id="feed"></div>
  <div id="topr">
    <button class="mini" id="roomChip" style="display:none" title="Tap to copy invite link"></button>
    <a class="insta" id="instaChip" href="https://instagram.com/lowkeytuffdav" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="#fff"/></svg>
      <span id="instaTxt">@lowkeytuffdav</span></a>
    <button class="mini" id="boardBtn">🏆 Board</button>
    <div id="stats" class="pill"></div>
  </div>
  <div id="lb"></div>
  <div id="death"></div>
  <div id="banner"></div>
  <div id="davi"></div>
  <button id="prompt"></button>
  <div id="hint"></div>
  <div id="joy"><i id="knob"></i></div>
  <button id="jump">JUMP</button>
</div>

<div id="title">
  <div class="vig"></div>
  <div id="floaties"></div>
  <a class="insta" id="instaTop" href="https://instagram.com/lowkeytuffdav" target="_blank" rel="noopener">
    <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="#fff"/></svg>
    <span id="instaTopTxt">@lowkeytuffdav</span></a>
  <div class="hero">
    <div class="kicker">★ A DAVICCINO PRODUCTION ★</div>
    <h1 class="glitch" data-text="BHAAG"><span>BHAAG</span></h1>
    <h1 class="glitch g2" data-text="BRAINROT"><span>BRAINROT</span></h1>
    <p class="tag">Outrun the floating faces. Vibe in the lobby. <b>Don't get touched.</b></p>
    <div class="card">
      <input type="text" id="nameIn" maxlength="14" placeholder="Your name" autocomplete="off">
      <button id="play" disabled>LOADING…</button>
    </div>
    <div class="card mp">
      <button id="mkRoom" disabled>🌐 CREATE ROOM</button>
      <input type="text" id="codeIn" maxlength="5" placeholder="ROOM CODE" autocomplete="off" autocapitalize="characters" spellcheck="false">
      <button id="joinRoom" disabled>JOIN</button>
    </div>
    <div id="mpMsg"></div>
    <div class="says"><div class="pic">R</div><div><small>DAVICCINO SAYS</small><span id="says">…</span></div></div>
    <div class="keys"><i>WASD / joystick: move</i><i>Space: jump</i><i>Drag: camera</i><i>Scroll / pinch: zoom</i><i>Q / R: rotate cam</i><i>E: interact</i></div>
  </div>
  <div class="marquee"><div class="mq" id="mq"></div></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="config.js" onerror="void 0"></script>
<script src="engine.js"></script>
<script src="world.js"></script>
<script src="net.js"></script>
<script src="game.js"></script>
</body>
</html>
