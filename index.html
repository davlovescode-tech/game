<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Bhaag Brainrot</title>
<meta name="description" content="Outrun the floating faces. A Daviccino production. @lowkeytuffdav">
<meta name="theme-color" content="#120a2e">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============ design tokens ============ */
:root{
  --ac:#ffb703;--ac2:#ff8a1f;--pink:#ff3df0;--cy:#27e6ff;--bad:#ff4d6d;--ok:#3ddc84;--bg:#120a2e;
  --f1:"Bungee",Impact,"Arial Black",sans-serif;--f2:"Poppins",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --glass:rgba(15,10,34,.72);--glass2:rgba(15,10,34,.88);--line:rgba(255,255,255,.14);--line2:rgba(255,255,255,.08);
  --tx:#fff;--tx2:rgba(255,255,255,.74);--tx3:rgba(255,255,255,.50);
  --r1:10px;--r2:14px;--r3:20px;--ease:cubic-bezier(.2,.8,.2,1);--sh:0 8px 28px rgba(0,0,0,.38);
  --top:max(12px,env(safe-area-inset-top));--bot:max(20px,env(safe-area-inset-bottom));
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);font-family:var(--f2);color:var(--tx);user-select:none;-webkit-user-select:none;-webkit-font-smoothing:antialiased}
#cv{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block;outline:none}
button{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ============ shared surfaces ============ */
.glass{background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(14px) saturate(1.3);-webkit-backdrop-filter:blur(14px) saturate(1.3);box-shadow:var(--sh)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:var(--r2);border:1px solid var(--line);background:rgba(255,255,255,.08);color:var(--tx);font:700 14px var(--f2);letter-spacing:.02em;cursor:pointer;white-space:nowrap;transition:background .15s,border-color .15s,transform .15s,filter .15s}
.btn:hover{background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.3)}
.btn:active{transform:translateY(1px) scale(.99)}
.btn.pri{border:0;color:#2b1500;background:linear-gradient(180deg,#ffd45c,#ff9d1f);box-shadow:0 1px 0 rgba(255,255,255,.55) inset,0 8px 22px rgba(255,138,31,.32)}
.btn.pri:hover{filter:brightness(1.06);transform:translateY(-1px)}
.btn[disabled]{opacity:.55;cursor:wait;filter:saturate(.5);transform:none}
.field{min-width:0;min-height:46px;padding:0 16px;border-radius:var(--r2);border:1px solid var(--line);background:rgba(8,5,22,.55);color:var(--tx);font:600 16px var(--f2);outline:none;transition:border-color .15s,box-shadow .15s}
.field::placeholder{color:var(--tx3);font-weight:500}
.field:focus{border-color:rgba(39,230,255,.8);box-shadow:0 0 0 3px rgba(39,230,255,.18)}
kbd{display:inline-block;min-width:22px;padding:2px 7px;border-radius:6px;border:1px solid rgba(255,255,255,.22);border-bottom-width:2px;background:rgba(255,255,255,.08);font:700 11px var(--f2);text-align:center;color:var(--tx);letter-spacing:.03em}
.insta{display:inline-flex;align-items:center;gap:8px;padding:5px 14px 5px 5px;border-radius:999px;text-decoration:none;font-weight:700;font-size:13px;color:var(--tx);background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);transition:border-color .15s,background .15s}
.insta:hover{border-color:rgba(255,255,255,.34);background:rgba(15,10,34,.78)}
.insta svg{width:28px;height:28px;padding:6px;border-radius:50%;background:linear-gradient(45deg,#f09433,#dc2743 55%,#bc1888)}

/* ============ title ============ */
#title{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;justify-content:center;padding:var(--top) clamp(20px,6vw,88px) 64px;pointer-events:none;overflow:hidden}
#title>*{pointer-events:auto}
#title .vig{position:absolute;inset:0;pointer-events:none;background:
  linear-gradient(90deg,rgba(14,9,34,.88) 0%,rgba(14,9,34,.6) 36%,rgba(14,9,34,.08) 68%,transparent),
  linear-gradient(180deg,rgba(14,9,34,.45),transparent 22%,transparent 72%,rgba(14,9,34,.8))}
#floaties{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#floaties span{position:absolute;bottom:-60px;opacity:0;animation:rise linear infinite}
@keyframes rise{0%{transform:translateY(0) rotate(0);opacity:0}12%{opacity:.5}88%{opacity:.5}100%{transform:translateY(-115vh) rotate(300deg);opacity:0}}
#title .insta{position:absolute;top:var(--top);right:clamp(14px,3vw,28px)}
.hero{position:relative;width:100%;max-width:560px}
.hero>*{animation:up .7s var(--ease) both}
.hero>:nth-child(2){animation-delay:.05s}.hero>:nth-child(3){animation-delay:.1s}.hero>:nth-child(4){animation-delay:.16s}.hero>:nth-child(5){animation-delay:.22s}.hero>:nth-child(6){animation-delay:.28s}.hero>:nth-child(n+7){animation-delay:.34s}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.kicker{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:11px;letter-spacing:.24em;color:var(--tx2);padding:6px 12px 6px 10px;border-radius:999px;background:var(--glass);border:1px solid var(--line);margin-bottom:14px}
.kicker:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ac);box-shadow:0 0 8px var(--ac)}
.glitch{margin:0;font-family:var(--f1);font-weight:400;line-height:.94;font-size:clamp(46px,10.5vw,112px);letter-spacing:.01em;text-transform:uppercase}
.glitch.g2{font-size:clamp(38px,8.6vw,92px)}
.glitch span{display:inline-block;background:linear-gradient(180deg,#fff 0%,#ffe27a 42%,#ff9a2e 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 6px 22px rgba(255,138,31,.28))}
.glitch.g2 span{background:linear-gradient(180deg,#fff 0%,#a8f3ff 44%,#6aa8ff 100%);-webkit-background-clip:text;background-clip:text;filter:drop-shadow(0 6px 22px rgba(39,230,255,.26))}
.tag{margin:16px 0 18px;font-weight:500;font-size:clamp(14px,2.2vw,17px);line-height:1.45;color:var(--tx2);text-shadow:0 1px 12px rgba(0,0,0,.6)}
.tag b{color:var(--tx);font-weight:700}
.card{display:flex;gap:8px;padding:8px;border-radius:var(--r3);background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(14px) saturate(1.3);-webkit-backdrop-filter:blur(14px) saturate(1.3);box-shadow:var(--sh)}
.card .field{flex:1 1 150px;min-height:52px}
#play{flex:1 1 150px;min-height:52px;border-radius:var(--r2);font:400 19px var(--f1);letter-spacing:.05em}
#play[disabled]{background:linear-gradient(110deg,#6b5a3a 30%,#9c8350 50%,#6b5a3a 70%);background-size:220% 100%;animation:shim 1.4s linear infinite;color:#fff;box-shadow:none;opacity:.8}
@keyframes shim{to{background-position:-220% 0}}
.sec{display:flex;align-items:center;gap:12px;margin:18px 2px 8px;font-weight:700;font-size:10.5px;letter-spacing:.2em;color:var(--tx3)}
.sec:after{content:"";flex:1;height:1px;background:var(--line2)}
.mp{display:grid;grid-template-columns:1.25fr 1fr auto;gap:8px}
.mp .btn,.mp .field{min-height:46px}
.mp #codeIn{text-transform:uppercase;letter-spacing:.3em;text-align:center;font-size:15px;padding:0 8px}
#mkRoom{background:rgba(39,230,255,.12);border-color:rgba(39,230,255,.38)}
#mkRoom:hover{background:rgba(39,230,255,.2)}
#mpMsg{margin-top:8px;min-height:18px;font-weight:600;font-size:13px;color:var(--ac);text-shadow:0 1px 8px #000}
.says{margin-top:14px;display:flex;align-items:center;gap:12px;padding:8px 16px 8px 8px;border-radius:var(--r3);background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);font-weight:600;font-size:14px;line-height:1.3;min-height:52px}
.says .pic{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font:400 17px var(--f1);color:#2b0a00;background:linear-gradient(135deg,#ffe066,#ff7ad9)}
.says small{display:block;font-size:10px;font-weight:700;letter-spacing:.2em;color:var(--ac);margin-bottom:1px}
.keys{display:flex;gap:6px 16px;flex-wrap:wrap;margin-top:16px;font-size:12px;color:var(--tx2)}
.keys span{display:inline-flex;align-items:center;gap:6px}
.marquee{position:absolute;left:0;right:0;bottom:0;height:36px;overflow:hidden;background:rgba(10,6,26,.72);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;align-items:center}
.marquee:before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:linear-gradient(90deg,var(--pink),#8338ec,var(--cy))}
.mq{display:flex;white-space:nowrap;font:700 11.5px var(--f2);letter-spacing:.2em;text-transform:uppercase;color:var(--tx2);animation:mq 34s linear infinite}
.mq span{padding-right:36px}
@keyframes mq{to{transform:translateX(-50%)}}

/* ============ hud ============ */
#timer{position:fixed;top:var(--top);left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;min-height:44px;padding:0 22px;border-radius:999px;white-space:nowrap;z-index:10;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(14px) saturate(1.3);-webkit-backdrop-filter:blur(14px) saturate(1.3);box-shadow:var(--sh)}
#timer .tl{font:700 11px var(--f2);letter-spacing:.18em;color:var(--tx2);text-transform:uppercase}
#timer b{font:800 24px/1 var(--f2);font-variant-numeric:tabular-nums;min-width:2ch;text-align:right}
#timer i{font-style:normal;font-weight:700;font-size:13px;color:var(--tx3);margin-left:-7px}
#timer.low b{color:var(--bad)}
#sub{position:fixed;top:calc(var(--top) + 52px);left:50%;transform:translateX(-50%);font:700 10.5px var(--f2);letter-spacing:.16em;text-transform:uppercase;color:var(--tx);white-space:nowrap;padding:3px 12px;border-radius:999px;background:rgba(15,10,34,.55);z-index:10;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
#chips{position:fixed;top:calc(var(--top) + 82px);left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:10;flex-wrap:wrap;justify-content:center;max-width:92vw}
#chips b{display:inline-flex;align-items:center;gap:6px;font:700 12px var(--f2);background:var(--glass2);border:1px solid rgba(255,183,3,.4);color:var(--tx);border-radius:999px;padding:4px 12px;box-shadow:0 4px 14px rgba(0,0,0,.3)}
#feed{position:fixed;top:var(--top);left:12px;display:flex;flex-direction:column;gap:5px;max-width:min(300px,46vw);pointer-events:none;z-index:10}
#feed .f{background:var(--glass2);border:1px solid var(--line2);border-left:3px solid var(--bad);padding:6px 10px;border-radius:var(--r1);font-size:12px;font-weight:600;line-height:1.3;animation:in .22s var(--ease)}
@keyframes in{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
#topr{position:fixed;top:var(--top);right:12px;display:flex;flex-direction:column;align-items:flex-end;gap:8px;z-index:10}
#topr .insta{padding:4px 12px 4px 4px;font-size:12px}
#topr .insta svg{width:24px;height:24px;padding:5px}
.ibar{display:flex;gap:6px}
.ibtn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:40px;min-width:40px;padding:0 11px;border-radius:12px;background:var(--glass);border:1px solid var(--line);color:var(--tx);font:700 12px var(--f2);letter-spacing:.03em;cursor:pointer;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);transition:background .15s,border-color .15s,transform .15s}
.ibtn:hover{background:rgba(15,10,34,.8);border-color:rgba(255,255,255,.32)}
.ibtn:active{transform:scale(.96)}
.ibtn span{display:none}
@media (min-width:700px){.ibtn span{display:inline}#sndBtn{padding:0}}
#sndBtn .off{display:none}#sndBtn.muted .on{display:none}#sndBtn.muted .off{display:block}
#roomChip em{font-style:normal;display:inline-flex;align-items:center;gap:4px;color:var(--tx2)}
#roomChip b{letter-spacing:.16em}
#roomChip svg{width:15px;height:15px}
#shareBtn{border:0;color:#2b1500;background:linear-gradient(180deg,#ffd45c,#ff9d1f);box-shadow:0 1px 0 rgba(255,255,255,.55) inset,0 8px 22px rgba(255,138,31,.34);animation:attn 1.6s ease-in-out 3}
#shareBtn span{display:inline}
@keyframes attn{50%{transform:scale(1.07)}}
#stats{display:none;min-width:136px;padding:10px 14px;border-radius:var(--r2);background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:var(--sh)}
#stats .r{display:flex;align-items:baseline;justify-content:space-between;gap:14px;line-height:1.35}
#stats .r+.r{margin-top:2px}
#stats .r>span{font:700 10px var(--f2);letter-spacing:.16em;color:var(--tx3)}
#stats b{font:800 20px var(--f2);font-variant-numeric:tabular-nums}
#stats i{font-style:normal;font-weight:700;font-size:13px;color:var(--tx3);margin-left:1px}

#lb{position:fixed;left:12px;top:calc(var(--top) + 88px);width:min(310px,64vw);background:var(--glass2);border:1px solid var(--line);border-radius:var(--r3);padding:14px 12px 10px;display:none;max-height:calc(100vh - 230px);overflow:auto;z-index:9;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:var(--sh)}
#lb h3{margin:0 4px 10px;font:700 10.5px var(--f2);letter-spacing:.22em;color:var(--tx3)}
#lb table{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
#lb th{color:var(--tx3);font-weight:700;font-size:10px;letter-spacing:.1em;text-align:right;padding:2px 6px 6px}
#lb th:nth-child(1),#lb td:nth-child(1){text-align:center;width:26px;padding-left:0}
#lb th:nth-child(2),#lb td:nth-child(2){text-align:left}
#lb td{padding:6px;text-align:right;border-top:1px solid var(--line2);color:var(--tx2);font-weight:500}
#lb td:nth-child(2){color:var(--tx);font-weight:600;max-width:112px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#lb td:last-child{color:var(--tx);font-weight:800}
#lb tr:nth-child(2) td:first-child{color:var(--ac);font-weight:800}
#lb tr.you td{background:rgba(255,183,3,.13)}
#lb tr.you td:first-child{border-radius:8px 0 0 8px;box-shadow:inset 3px 0 0 var(--ac)}
#lb tr.you td:last-child{border-radius:0 8px 8px 0}
#lb .win{margin:0 4px 10px;padding:7px 12px;border-radius:999px;text-align:center;font-weight:700;font-size:13px;color:var(--ok);background:rgba(61,220,132,.12);border:1px solid rgba(61,220,132,.35)}

#death{position:fixed;left:0;right:0;top:27%;text-align:center;font:400 clamp(26px,6vw,56px)/1.1 var(--f1);color:#fff;display:none;padding:22px 16px 20px;pointer-events:none;z-index:20;text-shadow:0 3px 0 rgba(0,0,0,.35),0 10px 36px rgba(0,0,0,.6);background:linear-gradient(180deg,transparent,rgba(10,6,26,.62) 30%,rgba(10,6,26,.62) 70%,transparent)}
#death small{display:table;margin:12px auto 0;padding:4px 16px;border-radius:999px;font:800 clamp(13px,2.4vw,17px) var(--f2);letter-spacing:.04em;color:var(--ac);background:rgba(255,183,3,.14);border:1px solid rgba(255,183,3,.45);text-shadow:none}
#banner{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);font:400 clamp(28px,6vw,60px)/1.1 var(--f1);text-align:center;display:none;text-shadow:0 2px 0 rgba(0,0,0,.55),0 0 18px rgba(0,0,0,.55),0 8px 30px rgba(0,0,0,.5);pointer-events:none;z-index:20;width:94vw}
#pop{position:fixed;left:50%;top:58%;transform:translate(-50%,0);font:400 clamp(22px,5vw,38px) var(--f1);color:var(--ac);text-shadow:0 2px 0 rgba(0,0,0,.7),0 0 16px rgba(0,0,0,.6),0 8px 26px rgba(0,0,0,.5);opacity:0;pointer-events:none;z-index:21;white-space:nowrap}
#pop.on{animation:popup 1.1s ease-out forwards}
@keyframes popup{0%{opacity:0;transform:translate(-50%,16px) scale(.7)}15%{opacity:1;transform:translate(-50%,0) scale(1.08)}70%{opacity:1}100%{opacity:0;transform:translate(-50%,-26px) scale(1)}}

#prompt{position:fixed;left:50%;bottom:calc(var(--bot) + 22px);transform:translateX(-50%);display:none;align-items:center;gap:10px;z-index:12;cursor:pointer;min-height:46px;padding:0 20px 0 10px;border-radius:999px;font:700 15px var(--f2);color:var(--tx);background:var(--glass2);border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:var(--sh);white-space:nowrap;transition:background .15s,border-color .15s}
#prompt:hover{background:rgba(25,18,52,.92);border-color:rgba(255,183,3,.6)}
#prompt:active{transform:translateX(-50%) scale(.98)}
#prompt kbd{background:var(--ac);color:#2b1500;border-color:#c98900;font-size:12px;min-width:26px;padding:3px 8px}
#prompt.t{padding-left:20px}
#hint{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);font:600 11.5px var(--f2);color:var(--tx2);background:var(--glass);border:1px solid var(--line2);padding:5px 14px;border-radius:999px;z-index:8;pointer-events:none;transition:opacity 1s;white-space:nowrap;max-width:94vw;overflow:hidden;text-overflow:ellipsis;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}

#davi{position:fixed;right:12px;top:42%;display:flex;flex-direction:column;gap:8px;z-index:30;pointer-events:none;width:min(300px,78vw)}
#davi .dv{display:flex;gap:11px;align-items:center;padding:9px 14px 9px 9px;border-radius:var(--r3);background:var(--glass2);border:1px solid var(--line);border-left:3px solid var(--ac);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:var(--sh);animation:dvin .4s var(--ease)}
#davi .dv.out{animation:dvout .4s forwards}
#davi .pic{flex:none;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font:400 20px var(--f1);color:#2b0a00;background:linear-gradient(135deg,#ffe066,#ff7ad9) center/cover;border:2px solid rgba(255,255,255,.85)}
#davi b{display:block;font:700 10px var(--f2);letter-spacing:.2em;color:var(--ac);margin-bottom:1px}
#davi span{font-weight:600;font-size:13px;line-height:1.3}
#davi em{display:block;font-style:normal;font-weight:500;font-size:11px;color:var(--tx3);margin-top:3px}
@keyframes dvin{from{opacity:0;transform:translateX(48px)}to{opacity:1;transform:none}}
@keyframes dvout{to{opacity:0;transform:translateX(48px)}}

#joy{position:fixed;left:20px;bottom:var(--bot);width:128px;height:128px;border-radius:50%;background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.28);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);touch-action:none;display:none;z-index:11}
#joy i{position:absolute;left:50%;top:50%;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.7);transform:translate(-50%,-50%)}
#jump{position:fixed;right:20px;bottom:calc(var(--bot) + 20px);width:82px;height:82px;border-radius:50%;border:1.5px solid rgba(255,255,255,.45);background:rgba(255,183,3,.88);color:#2b1500;font:800 13px var(--f2);letter-spacing:.14em;box-shadow:0 8px 24px rgba(0,0,0,.35);display:none;touch-action:none;z-index:11}
#jump:active{transform:scale(.95);background:#ffc83a}

#card{position:fixed;inset:0;display:none;place-items:center;background:rgba(8,5,20,.86);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:60;padding:12px}
#card .in{display:flex;flex-direction:column;align-items:center;gap:16px;max-width:100%}
#card img{max-height:72vh;max-width:92vw;border-radius:var(--r3);box-shadow:0 20px 60px rgba(0,0,0,.6);border:1px solid var(--line)}
#card .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

/* ============ the "hush" title mood (name-triggered) ============ */
.hush .says{border-color:#ffd9a0;box-shadow:0 0 28px #ffd9a066;transition:all .6s}.hush #nameIn{border-color:#ffd9a0;box-shadow:0 0 18px #ffd9a055}.hush .vig{background:radial-gradient(ellipse at 50% 60%,#ffd9a022,transparent 60%),var(--v,transparent)}

/* ============ small screens / touch ============ */
@media (max-width:640px){
  #title{justify-content:flex-start;padding-top:calc(var(--top) + 54px);padding-bottom:52px}
  #title .vig{background:linear-gradient(180deg,rgba(14,9,34,.7),rgba(14,9,34,.55) 55%,rgba(14,9,34,.85))}
  .kicker{margin-bottom:10px}
  .tag{margin:12px 0 14px}
  .sec{margin-top:14px}
  /* in-game: timer left, controls right, everything else stacks underneath so nothing collides at 360-430px */
  #timer{left:12px;transform:none;padding:0 14px;gap:8px}
  #timer .tl{font-size:10px;letter-spacing:.12em}
  #timer b{font-size:22px}
  #sub{left:12px;transform:none;top:calc(var(--top) + 52px);font-size:10px;letter-spacing:.12em;max-width:calc(100vw - 24px);padding:3px 10px}
  #chips{left:12px;transform:none;justify-content:flex-start;top:calc(var(--top) + 80px)}
  #feed{top:calc(var(--top) + 118px);max-width:48vw}
  #topr .insta{display:none}
  #lb{left:12px;right:12px;width:auto;top:calc(var(--top) + 112px);max-height:calc(100vh - var(--top) - 112px - 190px)}
  #davi{top:auto;left:12px;right:12px;width:auto;bottom:calc(var(--bot) + 232px)}
  #hint{bottom:calc(var(--bot) + 138px)}
  #prompt.t{bottom:calc(var(--bot) + 172px)}
}
@media (hover:none) and (pointer:coarse){.keys{display:none}}
@media (max-height:520px){.keys,.says{display:none}.hero{max-width:520px}#davi{top:auto;bottom:calc(var(--bot) + 120px)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001s!important;animation-iteration-count:1!important}.mq{animation:none}#floaties{display:none}}
</style>
</head>
<body>
<canvas id="cv" tabindex="0"></canvas>

<div id="hud" style="display:none">
  <div id="timer"></div>
  <div id="sub"></div>
  <div id="chips"></div>
  <div id="feed"></div>
  <div id="topr">
    <a class="insta" id="instaChip" href="https://instagram.com/lowkeytuffdav" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="5"/><circle cx="12" cy="12" r="3.6"/><circle cx="16.8" cy="7.2" r=".6" fill="#fff"/></svg><span id="instaTxt">@lowkeytuffdav</span></a>
    <div class="ibar">
      <button class="ibtn" id="roomChip" style="display:none" title="Tap to copy invite link"></button>
      <button class="ibtn" id="boardBtn" title="Leaderboard"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4h8v5a4 4 0 0 1-8 0V4z"/><path d="M8 6H5.5A1.5 1.5 0 0 0 4 7.5C4 9.7 5.6 11 8 11.3M16 6h2.5A1.5 1.5 0 0 1 20 7.5c0 2.2-1.6 3.5-4 3.8"/><path d="M12 13.2V17M8.5 20h7M10 17h4"/></svg><span>Board</span></button>
      <button class="ibtn" id="sndBtn" title="Sound on/off"><svg class="i on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5v5h3.6L12.5 19V5L7.6 9.5H4z"/><path d="M16 9a4.2 4.2 0 0 1 0 6M18.6 6.6a8 8 0 0 1 0 10.8" /></svg><svg class="i off" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5v5h3.6L12.5 19V5L7.6 9.5H4z"/><path d="m16.5 9.5 4.5 5m0-5-4.5 5"/></svg></button>
    </div>
    <button class="ibtn" id="shareBtn" style="display:none"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8.5h3L8.6 6h6.8L17 8.5h3a1 1 0 0 1 1 1V18a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9.5a1 1 0 0 1 1-1z"/><circle cx="12" cy="13.4" r="3.4"/></svg><span>Share</span></button>
    <div id="stats"></div>
  </div>
  <div id="lb"></div>
  <div id="death"></div>
  <div id="banner"></div>
  <div id="pop"></div>
  <div id="davi"></div>
  <button id="prompt"></button>
  <div id="hint"></div>
  <div id="joy"><i id="knob"></i></div>
  <button id="jump">JUMP</button>
</div>

<div id="card"><div class="in">
  <img id="cardImg" alt="Your BHAAG BRAINROT death card">
  <div class="row"><button class="btn pri" id="cardShare"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V4M8 7.5 12 3.5l4 4"/><path d="M5 12v6.5a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V12"/></svg> Share</button><button class="btn" id="cardSave">Save image</button><button class="btn" id="cardClose">Close</button></div>
</div></div>

<div id="title">
  <div class="vig"></div>
  <div id="floaties"></div>
  <a class="insta" id="instaTop" href="https://instagram.com/lowkeytuffdav" target="_blank" rel="noopener">
    <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="5"/><circle cx="12" cy="12" r="3.6"/><circle cx="16.8" cy="7.2" r=".6" fill="#fff"/></svg><span id="instaTopTxt">@lowkeytuffdav</span></a>
  <div class="hero">
    <div class="kicker">A DAVICCINO PRODUCTION</div>
    <h1 class="glitch" data-text="BHAAG"><span>BHAAG</span></h1>
    <h1 class="glitch g2" data-text="BRAINROT"><span>BRAINROT</span></h1>
    <p class="tag">Outrun the floating faces. Vibe in the lobby. <b>Don't get touched.</b></p>
    <div class="card">
      <input class="field" type="text" id="nameIn" maxlength="14" placeholder="Your name" autocomplete="off">
      <button class="btn pri" id="play" disabled>LOADING…</button>
    </div>
    <div class="sec">PLAY WITH FRIENDS</div>
    <div class="card mp">
      <button class="btn" id="mkRoom" disabled><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.8 3 2.8 14 0 17M12 3.5c-2.8 3-2.8 14 0 17"/></svg> Create room</button>
      <input class="field" type="text" id="codeIn" maxlength="5" placeholder="CODE" autocomplete="off" autocapitalize="characters" spellcheck="false">
      <button class="btn" id="joinRoom" disabled>Join</button>
    </div>
    <div id="mpMsg"></div>
    <div class="says"><div class="pic">R</div><div><small>DAVICCINO SAYS</small><span id="says">…</span></div></div>
    <div class="keys"><span><kbd>WASD</kbd>Move</span><span><kbd>Space</kbd>Jump</span><span><kbd>Drag</kbd>Camera</span><span><kbd>Scroll</kbd>Zoom</span><span><kbd>Q</kbd><kbd>R</kbd>Rotate</span><span><kbd>E</kbd>Interact</span></div>
  </div>
  <div class="marquee"><div class="mq" id="mq"></div></div>
</div>

<script src="lib/three.min.js"></script>
<script>window.THREE||document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"><\/script>')</script>
<script src="lib/post.js"></script>
<script src="lib/GLTFLoader.js"></script>
<script src="lib/SkeletonUtils.js"></script>
<script src="lib/RGBELoader.js"></script>
<script src="config.js" onerror="void 0"></script>
<script src="engine.js"></script>
<script src="world.js"></script>
<script src="net.js"></script>
<script src="game.js"></script>
</body>
</html>
